baseURL: "https://jaredgoronkin.com/"
languageCode: "en-us"
title: "Jared Goronkin"
theme: "PaperMod"

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 1
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 2
    - identifier: research
      name: Research
      url: /research/
      weight: 3
    - identifier: resume
      name: Resume
      url: /resume/
      weight: 4
    - identifier: contact
      name: Contact Me
      url: /contact/
      weight: 5


params:
  mainSections: ["projects", "papers"]
  ShowBreadCrumbs: true
  ShowBreadCrumbsInList: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowToc: false
  customCSS:
    - css/custom.css
    
  defaultTheme: auto
  enableInlineShortcodes: true

  homeInfoParams:
    Title: "Software Engineer  |   M.S. (RIT)"
    Content: "I build systems and tools that help designers bring their vision to life"

  featuredPages:
    - "/projects/echoes/"
    - "/projects/mosaic/"
    - "/research/animation-driven-sim/"
    - "/projects/procedural-terrain/"

  profileMode:
    enabled: false
    Title: "Jared Goronkin"
    subtitle: "Software engineer creating scalable systems and tools for game development"
    imageUrl: "https://jaredgoronkin.com/images/avatar.JPEG"
    imageTitle: "photo of Jared"

    buttons:
      - name: Projects
        url: /projects/
      - name: Research
        url: /research/

  socialIcons:
    - name: itchio
      url: "https://wyrdware.itch.io"
    - name: github
      url: "https://github.com/wyrdware"

#Metadata/SEO
  author: "Jared Goronkin"
  description: "A game developer building modular tools in Unity."
  keywords: [portfolio, game dev, unity, systems design]


outputs:
  home:
    - HTML
    - RSS
    - JSON