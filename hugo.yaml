baseURL: "https://jaredgoronkin.com/"
languageCode: "en-us"
title: "Jared Goronkin"
theme: "PaperMod"

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - identifier: resume
      name: Resume
      url: /resume/
      weight: 1
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 2
    - identifier: research
      name: Research
      url: /research/
      weight: 3
    - identifier: about
      name: About
      url: /about/
      weight: 4
    - identifier: contact
      name: Contact Me
      url: /contact/
      weight: 5


params:
  mainSections: ["projects", "papers"]
  ShowBreadCrumbs: true
  ShowBreadCrumbsInList: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowToc: false
  customCSS:
    - css/custom.css
    
  defaultTheme: auto
  enableInlineShortcodes: true

  homeInfoParams:
    Title: "Jared Goronkin  |   M.S. (RIT)"
    Content: |
      I build systems that make development fast and flexible
      > ***I am a multi-faceted, technically empowered <br> 
      Game Developer looking to join and complement <br> 
      the efforts of a passionate development team.***
    

    extraContent: |
      
      - Earned an **M.S. in Game Design and Development** from Rochester Institute of Technology (RIT). 
      - While earning my degree, I created [Mosaic](/projects/mosaic/), a Unity package that has helped teams develop and refine gameplay features with less technical overhead, resulting in shipping builds faster.
      - Led engineering and production on **Echoes in the Mist**, a PC game powered by Mosaic.
      - Refined game animation systems to better drive gameplay, benefit from procedural generation and expedite iteration.
      - Showcased work at **GDC** (NYS Pavilion, twice), **RetroGameCon**, **RPI GameFest**, **Roc Game Fest**, **EDGE**, and **Imagine RIT**
      - Co-founded an independent student initiative that raised **$30K+** to send 12 students to GDC. 

    
    image: "/images/JG5.jpg" #1 and 2 seem to be the best
    imageAlt: "Jared Goronkin portrait"
    imagePosition: "left"   # options: right | left | above-left | above-center
    imageSize: 180          # 150 - 180
    links:
      - { href: "/resume/",   label: "Resume" }
      - { href: "/projects/", label: "Projects" }
      - { href: "/research/", label: "Research" }
      - { href: "/about/",    label: "About" }
      - { href: "/contact/",  label: "Contact" }



  featuredPages:
    - "/projects/generalized-physical-animation-without-kinematic-bodies/"
    - "/projects/herdspun-harvest/"
    - "/projects/echoes/"
    - "/projects/mosaic/"

  profileMode:
    enabled: true
    imageUrl: "/images/JG5.jpg"
    imageTitle: "photo of Jared"
    Title: "Jared Goronkin"
    subtitle: |
      > *I'm building systems and tools to help designers bring their vision to life.*

      - Earned my **M.S. in Game Design and Development** from RIT, a program [ranked #3 in the nation](https://www.rit.edu/news/rit-named-top-5-university-study-game-design)
      - Showcased work at **GDC** (NYS Pavilion, twice), **RetroGameCon**, **RPI GameFest**, **Roc Game Fest**, **EDGE**, and **Imagine RIT**
      - Co-founded an independent student initiative that raised **$30K+** to send 12 students to GDC.
      - Built packages and systems that help small teams create complex experiences faster and cleaner


  socialIcons:
    - name: itchio
      url: "https://wyrdware.itch.io"
    - name: github
      url: "https://github.com/wyrdware"
    - name: linkedin
      url: "https://www.linkedin.com/in/jaredgoronkin/"

#Metadata/SEO
  author: "Jared Goronkin"
  description: "Software engineer creating scalable systems and tools for game development"
  keywords: [portfolio, game dev, unity, systems design]


outputs:
  home:
    - HTML
    - RSS
    - JSON
