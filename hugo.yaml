baseURL: "https://jaredgoronkin.com/"
languageCode: "en-us"
title: "Jared Goronkin"
theme: "PaperMod"

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 1
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 2
    - identifier: research
      name: Research
      url: /research/
      weight: 3
    - identifier: resume
      name: Resume
      url: /resume/
      weight: 4
    - identifier: contact
      name: Contact Me
      url: /contact/
      weight: 5


params:
  mainSections: ["projects", "papers"]
  ShowBreadCrumbs: true
  ShowBreadCrumbsInList: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowToc: false
  customCSS:
    - css/custom.css
    
  defaultTheme: auto
  enableInlineShortcodes: true

  homeInfoParams:
    Title: "Software Developer  |   M.S. (RIT)"
    Content: |
      > *I'm building systems and tools to help designers bring their vision to life.*

      - Earned my **M.S. in Game Design and Development** from RIT, a program [ranked #3 in the nation](https://www.rit.edu/news/rit-named-top-5-university-study-game-design)
      - Helped raise over **$30,000** to send students to GDC while at SUNY Poly.
      - Showcased work at **GDC** (NYS Pavilion, twice), **RetroGameCon**, **RPI GameFest**, **Roc Game Fest**, **EDGE**, and **Imagine RIT**
      - Built packages and systems that help small teams create complex experiences faster and cleaner





  featuredPages:
    - "/projects/echoes/"
    - "/projects/mosaic/"
    - "/research/animation-driven-sim/"
    - "/projects/procedural-terrain/"

  profileMode:
    enabled: false
    Title: "Jared Goronkin"
    subtitle: "Software engineer creating scalable systems and tools for game development"
    imageUrl: "https://jaredgoronkin.com/images/avatar.JPEG"
    imageTitle: "photo of Jared"

    buttons:
      - name: Projects
        url: /projects/
      - name: Research
        url: /research/

  socialIcons:
    - name: itchio
      url: "https://wyrdware.itch.io"
    - name: github
      url: "https://github.com/wyrdware"
    - name: linkedin
      url: "https://www.linkedin.com/in/jaredgoronkin/"

#Metadata/SEO
  author: "Jared Goronkin"
  description: "Software engineer creating scalable systems and tools for game development"
  keywords: [portfolio, game dev, unity, systems design]


outputs:
  home:
    - HTML
    - RSS
    - JSON