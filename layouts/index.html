{{ define "main" }}
  {{ partial "home_info.html" . }}
  {{ partial "home-featured.html" . }}

  {{ $page := . }}
  {{ with $page.Content }}
    <article class="first-entry home-info extra-info">
      <div class="entry-content">
        {{ if not ($page.Param "disableAnchoredHeadings") }}
          {{ partial "anchored_headings.html" . }}
        {{ else }}
          {{ . }}
        {{ end }}
      </div>
    </article>
  {{ end }}
{{ end }}
