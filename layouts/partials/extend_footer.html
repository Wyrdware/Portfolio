




<!-- Full-screen background shader (site-wide, PaperMod footer hook) -->

 <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"
   style="position:fixed;inset:0;display:block;pointer-events:none;
          z-index:0;background:#0b0d10;opacity:0;transition:opacity .18s ease-out"></canvas>

<script id="bg-vert" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = (aPos + 1.0) * 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<script id="bg-frag" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform float uTime;
uniform vec2  uRes;
uniform float uDark;  // 0.0 = light, 1.0 = dark
uniform vec2  uMouse; // 0..1 mouse position in UV space (x,y)

/* --------- EDIT BELOW TO CHANGE THE LOOK --------- */
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));
  vec2 u=f*f*(3.-2.*f);
  return mix(a,b,u.x) + (c-a)*u.y*(1.-u.x) + (d-b)*u.x*u.y;
}

void main(){
  vec2 aspect = vec2(uRes.x/uRes.y, 1.);
  vec2 p = (vUv - 0.5) * aspect;

  float t = uTime * 0.08;
  float n = 0.0;
  n += 0.55 * noise(3.0*p + vec2(t, 0.0));
  n += 0.30 * noise(6.0*p + vec2(0.0, t));
  n += 0.15 * noise(9.0*p + vec2(-t, t));

  // Base + tint (edit these 4 colors for quick theme changes)
  vec3 baseLight = vec3(0.98, 0.98, 0.99);
  vec3 baseDark  = vec3(0.12, 0.12, 0.13);
  vec3 tintLight = vec3(0.78, 0.75, 0.72);
  vec3 tintDark  = vec3(0.16, 0.17, 0.20);

  vec3 base = mix(baseLight, baseDark, uDark);
  vec3 tint = mix(tintLight, tintDark, uDark);

  // Map noise to 0..1 (soft contrast)
  float v = smoothstep(0.0, 1.0, n);

  /* --- Mouse accent (subtle color boost near cursor) -------------------- */
  vec2 aspect2 = vec2(uRes.x/uRes.y, 1.0);
  // Flip Y so mouse matches UV space (0,0 bottom-left)
  vec2 mouseUV = vec2(uMouse.x, 1.0 - uMouse.y);
  vec2 q = (vUv - 0.5) * aspect2;
  vec2 m = (mouseUV - 0.5) * aspect2;
  float d = length(q - m);
  float focus = smoothstep(0.45, 0.0, d);
  v = clamp(v + focus * 0.15, 0.0, 1.0);
  /* ---------------------------------------------------------------------- */

  vec3 col = mix(base, tint, v);
  gl_FragColor = vec4(col, 1.0);
}
/* --------- EDIT ABOVE TO CHANGE THE LOOK --------- */
</script>

<script>
(() => {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;

  // Give the canvas the fallback color immediately to avoid white before GL draws
  canvas.style.background = getComputedStyle(document.documentElement).getPropertyValue('--bg-fallback') || '#000';

  const prefersReduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const isMobile = /Mobi|Android/i.test(navigator.userAgent);

  const gl = canvas.getContext('webgl', {
    alpha: false,
    antialias: true,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    powerPreference: 'low-power'
  });
  if (!gl) { /* Keep solid fallback */ return; }

  // Compile helpers
  function make(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh)); gl.deleteShader(sh); return null;
    }
    return sh;
  }

  const vsh = make(gl.VERTEX_SHADER,   document.getElementById('bg-vert').textContent);
  const fsh = make(gl.FRAGMENT_SHADER, document.getElementById('bg-frag').textContent);
  const prog = gl.createProgram();
  gl.attachShader(prog, vsh); gl.attachShader(prog, fsh); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  // Fullscreen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([ -1,-1,  3,-1,  -1,3 ]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  // Uniforms
  const uTime  = gl.getUniformLocation(prog, 'uTime');
  const uRes   = gl.getUniformLocation(prog, 'uRes');
  const uDark  = gl.getUniformLocation(prog, 'uDark');
  const uMouse = gl.getUniformLocation(prog, 'uMouse');

  // Size & DPR (cap mobile to 1)
  const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 2);
  function resize(){
    const w = Math.floor(window.innerWidth  * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h){
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, w, h);
    }
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  // Theme sync (your build uses body.dark)
  const isDark = () => document.body.classList.contains('dark');
  const setTheme = () => gl.uniform1f(uDark, isDark() ? 1.0 : 0.0);
  setTheme();
  new MutationObserver(setTheme).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  // Mouse / touch tracking (normalized 0..1)
  let mouse = { x: 0.5, y: 0.5 };
  let targetMouse = { x: 0.5, y: 0.5 };

  function setMouseFromEvent(e){
    const t = e.touches?.[0];
    const cx = (t ? t.clientX : e.clientX) ?? 0;
    const cy = (t ? t.clientY : e.clientY) ?? 0;
    targetMouse.x = Math.min(Math.max(cx / window.innerWidth , 0), 1);
    targetMouse.y = Math.min(Math.max(cy / window.innerHeight, 0), 1);
  }
  window.addEventListener('mousemove', setMouseFromEvent, { passive: true });
  window.addEventListener('touchstart', setMouseFromEvent, { passive: true });
  window.addEventListener('touchmove',  setMouseFromEvent, { passive: true });

  function smoothMouse(dt){
    const k = Math.min(1, dt * 12);
    mouse.x += (targetMouse.x - mouse.x) * k;
    mouse.y += (targetMouse.y - mouse.y) * k;
  }

  // Draw once synchronously, then start RAF — only after draw we clear wrapper bg
  let start = performance.now(), raf = 0, prev = start;

  function draw(now, dt){
    if (!prefersReduced) smoothMouse(dt);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    const t = prefersReduced ? 0.0 : (now - start) / 1000.0;
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  gl.clearColor(0.043, 0.051, 0.063, 1.0); // ~ #0b0d10
  gl.clear(gl.COLOR_BUFFER_BIT);
  draw(performance.now(), 0);
  canvas.style.opacity = '1';
  // First synchronous draw to avoid flash (opaque, dark)
  draw(performance.now(), 0);
  // Reveal only after we’ve drawn a dark frame
  canvas.style.opacity = '1';
  document.body.classList.add('shader-ready');

  function frame(now){
    const dt = (now - prev) / 1000; prev = now;
    draw(now, dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else raf = requestAnimationFrame(frame);
  }, { passive: true });
})();
</script>

<style>
.bg-canvas{
  position: fixed;
  inset: 0;
  z-index: 0;               /* <— avoid negative stacking issues */
  pointer-events: none;
  background: var(--bg-fallback, #000);
}

header, main, footer { position: relative; z-index: 1; }

/* Only AFTER first shader frame, make wrappers transparent */
body.shader-ready .list,
body.shader-ready .single,
body.shader-ready .page{
  background: transparent !important;
}
</style>
